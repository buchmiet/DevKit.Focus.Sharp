name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/DevKit.Focus.Sharp.Tests/DevKit.Focus.Sharp.Tests.csproj -c Release
      - run: dotnet run --project tests/DevKit.Focus.Sharp.Tests/DevKit.Focus.Sharp.Tests.csproj -c Release --no-build
      - run: dotnet pack src/DevKit.Focus.Sharp/DevKit.Focus.Sharp.csproj -c Release -o artifacts/packages
